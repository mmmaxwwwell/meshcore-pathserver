# MeshCore Paths CI (Forgejo, runner label `nix`). Every tool comes from this
# repo's flake; every action is pinned by commit.
#
#   gate    every push / PR / weekly. ci/pre-pr.sh: lint, tests, build, secret
#           scanning (gitleaks + trufflehog), SAST (semgrep), SCA + licenses
#           (trivy, grype, osv-scanner, npm audit), IaC scan, SBOMs. NO secrets.
#           Uploads the reports (90 days) and the scanned site bundle.
#   plan    push to a branch other than main, after gate: tofu plan.
#   deploy  push to main, after gate: tofu plan + apply, sign the SBOMs and
#           the bundle (cosign), deploy THE BUNDLE GATE SCANNED (never rebuilt).
#
# Pull requests and scheduled runs never see a secret. Forgejo has no
# deployment environments, so secret scope is enforced by job conditions
# instead (zizmor's secrets-outside-env is configured off in .github/zizmor.yml
# for that reason).
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID         infra + deploy
#   R2_STATE_ACCESS_KEY_ID, R2_STATE_SECRET_ACCESS_KEY  OpenTofu state (R2)
#   TF_STATE_PASSPHRASE                                 state encryption
#   COSIGN_PRIVATE_KEY, COSIGN_PASSWORD                 signing (cosign.pub is committed)
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # new advisories land without new commits

permissions:
  contents: read  # checkout only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (lint, test, build, scan, SBOM)
    runs-on: nix
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0          # gitleaks / trufflehog scan the whole history
          persist-credentials: false
      - name: ci/pre-pr.sh
        run: nix develop -c ci/pre-pr.sh
      - name: Keep reports
        if: always()
        uses: forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: security-reports
          path: reports/
          retention-days: 90
      - name: Hand the scanned bundle to deploy
        uses: forgejo/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: site-dist
          path: site/dist/
          retention-days: 7

  plan:
    name: Infra plan
    needs: gate
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: nix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tofu plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          TF_IN_AUTOMATION: '1'
        run: nix develop -c ci/infra.sh plan

  deploy:
    name: Apply, sign, deploy
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch the scanned bundle
        uses: forgejo/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          name: site-dist
          path: site/dist/
      - name: tofu plan + apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
          TF_IN_AUTOMATION: '1'
        run: nix develop -c ci/infra.sh apply
      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: nix develop -c ci/sign.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          nix develop -c wrangler pages deploy site/dist --project-name meshcore-paths --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "ci ${GITHUB_SHA:0:12}"
