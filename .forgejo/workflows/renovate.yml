# Renovate: dependency update PRs on Forgejo (npm, flake inputs, CI action
# digests), weekly and on demand. Every PR goes through ci.yml like any other.
# RENOVATE_TOKEN belongs to a bot user with write access to THIS repo only
# (homelab scripts/meshcore-paths-forge.sh renovate), never the owner's token.
name: renovate
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read  # checkout only; Renovate pushes branches with its own bot token

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: nix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: 'meshcore-renovate <meshcore-renovate@noreply.invalid>'
          LOG_LEVEL: info
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then echo "::error::RENOVATE_TOKEN is not set"; exit 1; fi
          nix develop -c renovate
